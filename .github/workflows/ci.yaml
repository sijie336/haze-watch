name: Check HazeWatch
on: [push, pull_request]
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: PYTHONPATH=backend pytest backend/tests -q
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait
      - run: |
          curl --fail http://localhost:4200/
          curl --fail http://localhost:8000/health/ready
          python - <<'PY'
          import time, urllib.request, json
          for attempt in range(30):
              data=json.load(urllib.request.urlopen('http://localhost:8000/api/v1/readings/latest'))
              if len(data['readings'])==10:
                  assert data['mode']=='demo'
                  break
              time.sleep(2)
          else:
              raise AssertionError('Worker did not populate all regional readings')
          PY
      - if: always()
        run: docker compose logs --tail=80
      - if: always()
        run: docker compose down -v
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
      - run: terraform -chdir=infra fmt -check
      - run: terraform -chdir=infra init -backend=false
      - run: terraform -chdir=infra validate
